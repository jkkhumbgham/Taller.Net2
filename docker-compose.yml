version: "3.9"

networks:
  stats-network:
    driver: bridge

services:

  # ─────────────────────────────────────────────────────────
  # Databases
  # ─────────────────────────────────────────────────────────
  content_db:
    image: postgres:16
    container_name: content_db
    environment:
      POSTGRES_DB: content_db
      POSTGRES_USER: content_user
      POSTGRES_PASSWORD: content_pass
    ports:
      - "5432:5432"
    volumes:
      - ./db/content:/docker-entrypoint-initdb.d
      - content_db_data:/var/lib/postgresql/data
    networks:
      - stats-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U content_user -d content_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  user_db:
    image: postgres:16
    container_name: user_db
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: user_user
      POSTGRES_PASSWORD: user_pass
    ports:
      - "5433:5432"
    volumes:
      - ./db/user:/docker-entrypoint-initdb.d
      - user_db_data:/var/lib/postgresql/data
    networks:
      - stats-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_user -d user_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────────────────
  # Architecture 1: Monolítica  (port 5001)
  # ─────────────────────────────────────────────────────────
  monolitica:
    build:
      context: ./Monolitica
      dockerfile: Dockerfile
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__UserDb=Host=user_db;Port=5432;Database=user_db;Username=user_user;Password=user_pass
      - ConnectionStrings__ContentDb=Host=content_db;Port=5432;Database=content_db;Username=content_user;Password=content_pass
    networks:
      - stats-network
    depends_on:
      content_db:
        condition: service_healthy
      user_db:
        condition: service_healthy

  # ─────────────────────────────────────────────────────────
  # Architecture 2: Servicios  (port 5002)
  # ─────────────────────────────────────────────────────────
  servicios-api:
    build:
      context: ./Servicios/Servicios.API
      dockerfile: Dockerfile
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__UserDb=Host=user_db;Port=5432;Database=user_db;Username=user_user;Password=user_pass
      - ConnectionStrings__ContentDb=Host=content_db;Port=5432;Database=content_db;Username=content_user;Password=content_pass
    networks:
      - stats-network
    depends_on:
      content_db:
        condition: service_healthy
      user_db:
        condition: service_healthy

  # ─────────────────────────────────────────────────────────
  # Architecture 3: MicroServicios
  # ─────────────────────────────────────────────────────────
  ms-inscripcion:
    build:
      context: ./MicroServicios/EstadisticasInscripcion
      dockerfile: Dockerfile
    ports:
      - "5010:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__UserDb=Host=user_db;Port=5432;Database=user_db;Username=user_user;Password=user_pass
      - ConnectionStrings__ContentDb=Host=content_db;Port=5432;Database=content_db;Username=content_user;Password=content_pass
    networks:
      - stats-network
    depends_on:
      content_db:
        condition: service_healthy
      user_db:
        condition: service_healthy

  ms-lecciones:
    build:
      context: ./MicroServicios/EstadisticasLecciones
      dockerfile: Dockerfile
    ports:
      - "5011:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__UserDb=Host=user_db;Port=5432;Database=user_db;Username=user_user;Password=user_pass
      - ConnectionStrings__ContentDb=Host=content_db;Port=5432;Database=content_db;Username=content_user;Password=content_pass
    networks:
      - stats-network
    depends_on:
      content_db:
        condition: service_healthy
      user_db:
        condition: service_healthy

  ms-cuestionarios:
    build:
      context: ./MicroServicios/EstadisticasCuestionarios
      dockerfile: Dockerfile
    ports:
      - "5012:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__UserDb=Host=user_db;Port=5432;Database=user_db;Username=user_user;Password=user_pass
      - ConnectionStrings__ContentDb=Host=content_db;Port=5432;Database=content_db;Username=content_user;Password=content_pass
    networks:
      - stats-network
    depends_on:
      content_db:
        condition: service_healthy
      user_db:
        condition: service_healthy

volumes:
  content_db_data:
  user_db_data:
