version: "3.9"

# The databases (content_db on port 5432, user_db on port 5433) are managed
# by an external Docker Compose project (e.g., the Jakarta project).
# This file only defines the five .NET application services.

networks:
  stats-network:
    driver: bridge

services:

  # ─────────────────────────────────────────────────────────
  # Architecture 1: Monolítica  (port 5001)
  # ─────────────────────────────────────────────────────────
  monolitica:
    build:
      context: ./Monolitica
      dockerfile: Dockerfile
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__UserDb=Host=host.docker.internal;Port=5433;Database=user_db;Username=user_user;Password=user_pass
      - ConnectionStrings__ContentDb=Host=host.docker.internal;Port=5432;Database=content_db;Username=content_user;Password=content_pass
    networks:
      - stats-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ─────────────────────────────────────────────────────────
  # Architecture 2: Servicios  (port 5002)
  # ─────────────────────────────────────────────────────────
  servicios-api:
    build:
      context: ./Servicios/Servicios.API
      dockerfile: Dockerfile
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__UserDb=Host=host.docker.internal;Port=5433;Database=user_db;Username=user_user;Password=user_pass
      - ConnectionStrings__ContentDb=Host=host.docker.internal;Port=5432;Database=content_db;Username=content_user;Password=content_pass
    networks:
      - stats-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ─────────────────────────────────────────────────────────
  # Architecture 3: MicroServicios
  # ─────────────────────────────────────────────────────────
  ms-inscripcion:
    build:
      context: ./MicroServicios/EstadisticasInscripcion
      dockerfile: Dockerfile
    ports:
      - "5010:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__UserDb=Host=host.docker.internal;Port=5433;Database=user_db;Username=user_user;Password=user_pass
      - ConnectionStrings__ContentDb=Host=host.docker.internal;Port=5432;Database=content_db;Username=content_user;Password=content_pass
    networks:
      - stats-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ms-lecciones:
    build:
      context: ./MicroServicios/EstadisticasLecciones
      dockerfile: Dockerfile
    ports:
      - "5011:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__UserDb=Host=host.docker.internal;Port=5433;Database=user_db;Username=user_user;Password=user_pass
      - ConnectionStrings__ContentDb=Host=host.docker.internal;Port=5432;Database=content_db;Username=content_user;Password=content_pass
    networks:
      - stats-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ms-cuestionarios:
    build:
      context: ./MicroServicios/EstadisticasCuestionarios
      dockerfile: Dockerfile
    ports:
      - "5012:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__UserDb=Host=host.docker.internal;Port=5433;Database=user_db;Username=user_user;Password=user_pass
      - ConnectionStrings__ContentDb=Host=host.docker.internal;Port=5432;Database=content_db;Username=content_user;Password=content_pass
    networks:
      - stats-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
